name: Release builds

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86-64 (Debian 12)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates build-essential pkg-config qtbase5-dev libqtermwidget5-1-dev git ripgrep file rustc
      - uses: actions/checkout@v4
      - name: Build and test
        run: make -j2 all check
      - name: Package
        run: |
          version=v0.1.0
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; fi
          bash tools/package-linux.sh "$version" dist
      - uses: actions/upload-artifact@v4
        with:
          name: interact-studio-linux-x86_64
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows x86-64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-ripgrep
      - name: Configure
        shell: msys2 {0}
        run: |
          bash tools/windows/check-stage.sh Configure cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        shell: msys2 {0}
        run: bash tools/windows/check-stage.sh Compile cmake --build build/windows --parallel 2
      - name: Test the application
        id: desktop
        shell: msys2 {0}
        run: bash tools/windows/check-stage.sh Desktop ctest --test-dir build/windows --output-on-failure -R '^(desktop-launch|editor|languages|liveserver)$'
      - name: Test the terminal
        if: success() || steps.desktop.outcome == 'failure'
        shell: msys2 {0}
        run: bash tools/windows/check-stage.sh Terminal ctest --test-dir build/windows --output-on-failure -R '^windows-terminal$'
      - name: Package
        shell: msys2 {0}
        run: |
          version=v0.1.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="$GITHUB_REF_NAME"; fi
          bash tools/windows/check-stage.sh Packaging bash tools/package-windows.sh build/windows "$version" dist
      - uses: actions/upload-artifact@v4
        with:
          name: interact-studio-windows-x86_64
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Publish the verified tag and binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "docs/releases/$tag.md"
          cd dist
          shopt -s nullglob
          assets=(*.deb *.tar.gz *.zip *-setup.exe)
          (("${#assets[@]}" == 4))
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          gh release create "$tag" "${assets[@]}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Interact Studio ${tag#v}" --notes-file "../docs/releases/$tag.md"
